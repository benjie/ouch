compressionLevel: mixed
enableGlobalCache: false
nodeLinker: node-modules
# re-enable a specific script by combining enableScripts and dependenciesMeta.
enableScripts: false
npmMinimalAgeGate: 7d
npmPreapprovedPackages:
- "@benjie/*"
- "@dataplan/*"
- "@grafserv/*"
- "@graphile-contrib/*"
- "@graphile/*"
- "grafast"
- "grafserv"
- "graphile"
- "graphile-build"
- "graphile-build-pg"
- "graphile-config"
- "graphile-utils"
- "pg-introspection"
- "pg-sql2"
- "postgraphile"
- "postgraphile-plugin-connection-filter"
- "ruru"
- "ruru-components"
- "ruru-types"
- "tamedevil"
approvedGitRepositories: [
  "https://github.com/yarnpkg/*",
  "ssh://git@github.com/yarnpkg/*",
]

yarnPath: .yarn/releases/yarn-4.14.1.cjs
